name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - name: Compile check
        run: python -c "import glob, py_compile; [py_compile.compile(f, doraise=True) for f in glob.glob('*.py') + glob.glob('access_exporter/*.py') + glob.glob('tests/*.py') + glob.glob('tools/*.py')]"
      - name: Test
        run: python -m pytest -q tests
        env:
          QT_QPA_PLATFORM: offscreen
