name: Copilot setup steps

# NL: Bereidt de omgeving van de Copilot cloud agent voor (Ubuntu): Python, Qt- en ODBC-systeembibliotheken en
#     de dependencies in .venv, zodat de agent direct de tests kan draaien. Draait ook bij wijzigingen aan dit
#     bestand, zodat je kunt zien of de set-up werkt. De .exe wordt bij een release gebouwd door
#     release-assets.yml (Windows).
# EN: Prepares the Copilot cloud agent's environment (Ubuntu): Python, Qt and ODBC system libraries and the
#     dependencies in .venv, so the agent can run the tests straight away. Also runs when this file changes,
#     so you can see whether the set-up works. The .exe is built on release by release-assets.yml (Windows).

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # NL: De job moet 'copilot-setup-steps' heten, anders gebruikt Copilot hem niet.
  # EN: The job must be called 'copilot-setup-steps', otherwise Copilot does not use it.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # NL: PyQt6 levert Qt mee, maar heeft deze systeembibliotheken nodig (ook voor het offscreen-platform).
      #     pyodbc heeft libodbc (unixodbc) nodig om geïmporteerd te kunnen worden.
      # EN: PyQt6 ships Qt itself, but needs these system libraries (also for the offscreen platform).
      #     pyodbc needs libodbc (unixodbc) to be importable.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 unixodbc

      - name: Install dependencies in .venv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      # NL: Snelle controle dat Qt offscreen werkt en de tests slagen.
      # EN: Quick check that Qt works offscreen and the tests pass.
      - name: Smoke test
        run: .venv/bin/python -m unittest discover -s tests -v
