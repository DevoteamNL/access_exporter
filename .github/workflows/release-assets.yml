name: Release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (e.g. v1.1.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt pytest pyinstaller

      - name: Test
        run: python -m pytest -q tests
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build single-file executable
        run: .\build.ps1 -Python python

      - name: Checksum
        run: |
          $hash = (Get-FileHash dist/AccessExporter.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist/AccessExporter.exe.sha256 -Value "$hash  AccessExporter.exe" -Encoding ascii

      - name: Create source zip
        run: |
          $version = "${{ inputs.tag || github.event.release.tag_name }}".TrimStart("v")
          git archive --format=zip --prefix="access_exporter-$version/" -o "dist/access_exporter-$version-source.zip" HEAD

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ inputs.tag || github.event.release.tag_name }}".TrimStart("v")
          gh release upload "${{ inputs.tag || github.event.release.tag_name }}" "dist/AccessExporter.exe#AccessExporter.exe (Windows 64-bit)" "dist/AccessExporter.exe.sha256#SHA256 checksum" "dist/access_exporter-$version-source.zip#Source code (zip)" --clobber
